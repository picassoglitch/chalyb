<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><title>Paso 1</title>
<link rel="stylesheet" href="style.css"><style>
.col{max-width:820px}
.title{margin-top:72px;text-align:center}
.inp{margin-top:48px;display:flex;align-items:center;gap:16px;height:84px;padding:0 12px 0 26px;background:#fff;border-radius:22px;box-shadow:0 0 0 2px var(--accent),0 0 0 7px rgba(91,75,255,.12),var(--shadow)}
.inp svg.i{width:28px;height:28px;color:var(--ink3)}
.inp .ph{flex:1;font-size:23px;color:#A8A8B0}
.inp .caret{display:inline-block;width:2px;height:30px;background:var(--accent);vertical-align:middle;margin-right:2px}
.inp .paste{height:60px;padding:0 22px;border-radius:15px;background:var(--tint);color:var(--accent);font-weight:650;font-size:18px}
.help{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;color:var(--ink2);font-size:17px}
.or{display:flex;align-items:center;gap:18px;margin:40px 0 24px;color:var(--ink3);font-size:17px;font-weight:500}
.or::before,.or::after{content:"";flex:1;height:1px;background:#DEDEE4}
.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.alt{height:84px;border-radius:20px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:14px;font-size:19px;font-weight:600}
.alt .u{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.alt .u svg{width:22px;height:22px}
.foot{margin-top:52px}
.note{margin-top:16px;text-align:center;font-size:16px;color:var(--ink3);display:flex;gap:8px;justify-content:center;align-items:center}
.note svg.i{width:18px;height:18px}
</style></head><body><div class="flow"><header class="topbar" style="position:relative"><button class="back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Inicio</button>
<div class="toptitle"><span class="tmark"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></span>Hacer clips</div>
<button class="close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header><div class="steps"><div class="bar"><i class="on"></i><i class=""></i><i class=""></i></div><div class="t">Paso 1 de 3</div></div>
<div class="col"><div class="title"><h1>Pega el enlace de tu stream o video</h1>
<p class="sub">Copia la dirección de tu video y pégala aquí. Nosotros hacemos el resto.</p></div>
<div class="inp"><svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><div class="ph"><span class="caret"></span>https://youtube.com/...</div><button class="paste">Pegar</button></div>
<div class="help">Funciona con YouTube, Twitch, Kick y Facebook.</div>
<div class="or">o también puedes</div>
<div class="alts"><button class="alt"><svg viewBox="0 0 28 20" width="34" height="24"><rect width="28" height="20" rx="6" fill="#FF0033"/><path d="M11.2 5.6v8.8l7.6-4.4z" fill="#fff"/></svg>Conectar YouTube</button><button class="alt"><svg viewBox="0 0 24 26" width="26" height="28"><path d="M3.5 1 1.8 5.4v16h5.4v3h3l3-3h4.4l5.6-5.6V1z" fill="#9146FF"/><path d="M5.5 3h15v11.8l-3.4 3.4h-5.4l-3 3v-3H5.5z" fill="#fff"/><path d="M11 6.6h2v5.6h-2zM16.2 6.6h2v5.6h-2z" fill="#9146FF"/></svg>Conectar Twitch</button>
<button class="alt"><span class="u"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span>Subir un video</button></div>
<div class="foot"><button class="btn btn-primary btn-xl">Continuar</button>
<div class="note"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Tu video es privado. Solo tú puedes verlo.</div></div></div></div></body></html>
